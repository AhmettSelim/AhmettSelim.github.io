<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Arena: World Battle</title>
    <meta name="description" content="Learn English through fun competitive battles. Play English Arena: World Battle!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0b1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 100, 80, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(80, 200, 255, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            margin-bottom: 24px;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
            object-fit: cover;
        }

        .app-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .description {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            text-decoration: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
        }

        .footer-links {
            margin-top: 60px;
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
        }

        .footer-links a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #a78bfa;
        }

        .copyright {
            margin-top: 20px;
            color: #4b5563;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="English Arena Logo" class="app-icon">
        <h1 class="app-title">English Arena</h1>
        <p class="description">Master English through exciting real-time multiplayer word battles! Compete with players worldwide and climb the global leaderboards.</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.ahmetselim.englisharena" target="_blank" rel="noopener" class="btn">Download on Google Play</a>

        <div class="footer-links">
            <a href="/English-arena-legal/">Privacy Policy & Terms</a>
            <a href="mailto:ahmetselimsenguloglu@gmail.com">Contact Support</a>
        </div>
        
        <div class="copyright">
            &copy; 2026 Ahmet Selim Şengüloğlu. All rights reserved.
        </div>
    </div>
</body>
</html>
